<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت - منصة رأس غارب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top center, #0f172a 0%, #050811 100%);
      color: #f8fafc;
      font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .icon-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
    }
    h1 {
      font-family: 'Cairo', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .badge-offline {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/icons/icon-192.png" alt="رأس غارب">
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن الاتصال بالإنترنت مفقود حالياً. يرجى التأكد من شبكة الواي فاي أو بيانات الهاتف والمحاولة مرة أخرى.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      إعادة المحاولة الآن
    </button>
    <div class="badge-offline">تطبيق منصة رأس غارب</div>
  </div>
</body>
</html>
