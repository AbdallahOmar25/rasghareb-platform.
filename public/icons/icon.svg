<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Golden Beacon Glow -->
    <radialGradient id="beaconGlow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Beam Light Left -->
    <linearGradient id="beamLeft" x1="100%" y1="50%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Beam Light Right -->
    <linearGradient id="beamRight" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Sea Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="1" />
    </linearGradient>

    <!-- Tower Metallic Gradient -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container / Background -->
  
    <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#bgGrad)" />
    <rect x="16" y="16" width="992" height="992" rx="224" fill="none" stroke="url(#borderGrad)" stroke-width="8" />
  

  <g transform="translate(60, 60) scale(0.8828125)">
    <!-- Starfield dots -->
    <circle cx="160" cy="180" r="3" fill="#ffffff" opacity="0.6" />
    <circle cx="280" cy="130" r="2" fill="#ffffff" opacity="0.4" />
    <circle cx="780" cy="190" r="3.5" fill="#ffffff" opacity="0.7" />
    <circle cx="860" cy="240" r="2" fill="#ffffff" opacity="0.5" />
    <circle cx="200" cy="300" r="2.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="820" cy="360" r="2.5" fill="#38bdf8" opacity="0.6" />

    <!-- Ambient Beacon Halo -->
    <circle cx="512" cy="320" r="380" fill="url(#beaconGlow)" />

    <!-- Light Beams Sweeping Across Night -->
    <polygon points="512,320 0,160 0,380" fill="url(#beamLeft)" />
    <polygon points="512,320 1024,160 1024,380" fill="url(#beamRight)" />

    <!-- Sea Waves at Bottom -->
    <path d="M 0 680 Q 256 640, 512 680 T 1024 680 L 1024 1024 L 0 1024 Z" fill="url(#seaGrad)" opacity="0.75" />
    <path d="M 0 730 Q 256 700, 512 730 T 1024 730 L 1024 1024 L 0 1024 Z" fill="url(#seaGrad)" opacity="0.9" />

    <!-- Subtle Wave Highlights -->
    <path d="M 120 740 Q 260 725, 420 740" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 600 755 Q 740 740, 900 755" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 300 790 Q 480 775, 720 790" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Lighthouse Foundation Pier / Rocks -->
    <polygon points="340,700 684,700 720,740 304,740" fill="#1e293b" />
    <polygon points="360,680 664,680 684,700 340,700" fill="#334155" />

    <!-- Lighthouse Tower Shaft (Eiffel-Style Geometric) -->
    <g filter="url(#shadow)">
      <!-- Main Tapered Body -->
      <polygon points="448,370 576,370 600,680 424,680" fill="url(#towerGrad)" />

      <!-- Architectural Stripes (Classic Red/Dark Bands) -->
      <polygon points="441,430 583,430 588,480 436,480" fill="#0f172a" opacity="0.85" />
      <polygon points="431,540 593,540 597,590 427,590" fill="#0f172a" opacity="0.85" />

      <!-- Lattice / Balcony Lines -->
      <line x1="430" y1="676" x2="594" y2="676" stroke="url(#goldAcc)" stroke-width="6" />
      <line x1="438" y1="592" x2="586" y2="592" stroke="url(#goldAcc)" stroke-width="4" />
      <line x1="444" y1="482" x2="580" y2="482" stroke="url(#goldAcc)" stroke-width="4" />

      <!-- Windows / Portholes -->
      <circle cx="512" cy="455" r="9" fill="#fbbf24" />
      <circle cx="512" cy="565" r="11" fill="#fbbf24" />
      <rect x="502" y="630" width="20" height="36" rx="10" fill="#0284c7" />

      <!-- Lantern Room Gallery (Balcony) -->
      <rect x="428" y="356" width="168" height="18" rx="5" fill="url(#goldAcc)" />
      <!-- Glass Lantern Chamber -->
      <rect x="444" y="296" width="136" height="60" rx="4" fill="#0369a1" />
      <!-- Glass Glow & Struts -->
      <rect x="452" y="302" width="120" height="48" rx="2" fill="#fef08a" opacity="0.95" />
      <line x1="484" y1="296" x2="484" y2="356" stroke="#0f172a" stroke-width="5" />
      <line x1="512" y1="296" x2="512" y2="356" stroke="#0f172a" stroke-width="5" />
      <line x1="540" y1="296" x2="540" y2="356" stroke="#0f172a" stroke-width="5" />

      <!-- Cupola / Dome Roof -->
      <path d="M 440 296 Q 512 230 584 296 Z" fill="url(#towerGrad)" />
      <!-- Pinnacle / Lightning Rod / Spire -->
      <rect x="508" y="200" width="8" height="36" fill="url(#goldAcc)" />
      <circle cx="512" cy="196" r="8" fill="#fbbf24" />
    </g>

    <!-- Super-bright Lantern Flash Core -->
    <circle cx="512" cy="326" r="18" fill="#ffffff" />
    <circle cx="512" cy="326" r="32" fill="#fef08a" opacity="0.8" />

    <!-- Elegant City Title: رأس غارب -->
    <text x="512" y="870" 
          text-anchor="middle" 
          font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" 
          font-size="68" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#ffffff">
      رأس غارب
    </text>

    <!-- English Subtitle: RAS GHAREB -->
    <text x="512" y="920" 
          text-anchor="middle" 
          font-family="'Onest', 'DM Sans', sans-serif" 
          font-size="26" 
          font-weight="700" 
          letter-spacing="9" 
          fill="#38bdf8">
      RAS GHAREB
    </text>
  </g>
</svg>